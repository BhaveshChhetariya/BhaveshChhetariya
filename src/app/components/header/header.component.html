<header #header [ngClass]="{'scrolled': isScrolled, 'menu-open': isMobileMenuOpen}">
  <!-- Progress bar that shows scroll progress -->
  <div class="scroll-progress-bar" [style.width.%]="scrollProgress"></div>
  
  <div class="header-container">
    <div class="logo">
      <a (click)="scrollToSection('home')" class="logo-link">
        <div class="logo-icon">
          <span class="logo-text-icon">BC</span>
          <div class="logo-icon-shape"></div>
        </div>
        <!-- <div class="logo-text-container">
          <span class="logo-text">Bhavesh<span class="highlight">Chhetariya</span></span>
          <span class="logo-subtitle">Full Stack Developer</span>
        </div> -->
      </a>
    </div>
    
    <nav>
      <ul class="nav-links" [ngClass]="{'active': isMobileMenuOpen}">
        <li *ngFor="let item of navItems">
          <a (click)="scrollToSection(item.id)" 
             [ngClass]="{'active': activeSection === item.id}"
             class="nav-link">
            <!-- <span class="nav-icon"><i [class]="item.icon"></i></span> -->
            <span class="nav-text">{{item.name}}</span>
            <span class="nav-indicator" *ngIf="activeSection === item.id"></span>
          </a>
        </li>
      </ul>
    </nav>
    
    <div class="header-actions">
      <div class="theme-toggle-wrapper" [ngClass]="{'dark': isDarkMode}">
        <button class="theme-toggle" (click)="toggleTheme()" aria-label="Toggle theme">
          <i class="fas" [ngClass]="isDarkMode ? 'fa-sun' : 'fa-moon'"></i>
          <!-- <span class="theme-label">{{ isDarkMode ? 'Light' : 'Dark' }}</span> -->
        </button>
      </div>
      
      <div class="social-links">
        <a *ngFor="let social of socialLinks" 
           [href]="social.url" 
           target="_blank" 
           class="social-link" 
           [attr.aria-label]="social.name">
          <i [class]="social.icon"></i>
        </a>
      </div>
      
      <a href="assets/resume.pdf" target="_blank" class="resume-btn">
        <span>Resume</span>
        <i class="fas fa-download"></i>
      </a>
      
      <div class="hamburger" [ngClass]="{'active': isMobileMenuOpen}" (click)="toggleMobileMenu()" aria-label="Menu">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  </div>
  
  <!-- Mobile menu overlay -->
  <div class="mobile-overlay" *ngIf="isMobileMenuOpen" (click)="closeMobileMenu()"></div>
  
  <!-- Mobile menu additional content -->
  <div class="mobile-menu-footer" *ngIf="isMobileMenuOpen">
    <div class="mobile-social-links">
      <a *ngFor="let social of socialLinks" 
         [href]="social.url" 
         target="_blank" 
         [attr.aria-label]="social.name">
        <i [class]="social.icon"></i>
      </a>
    </div>
    <div class="mobile-contact">
      <a href="mailto:contact&#64;bhaveshchhetariya.com">
        <i class="fas fa-envelope"></i>
        contact&#64;bhaveshchhetariya.com
      </a>
    </div>
  </div>
</header>
