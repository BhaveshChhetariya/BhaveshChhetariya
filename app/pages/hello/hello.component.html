<div class="hello-container fade-in" role="main" aria-label="Portfolio introduction and Snake game">
  <div class="hello-left">
    <div class="profile-section">
      <div class="profile-image">
        <img src="https://via.placeholder.com/200x200/4A90E2/FFFFFF?text=Your+Photo" 
             alt="Profile photo of Bhavesh, Full Stack Developer"
             loading="lazy">
      </div>
      <div class="intro-text">
        <h1 id="greeting">Hi all, I am</h1>
        <h2 class="name" aria-describedby="greeting">Bhavesh</h2>
        <p class="role" role="text">> Full Stack Developer</p>
      </div>
    </div>
    
    <div class="code-snippet" role="region" aria-label="Code snippet with GitHub link">
      <div class="code-comment" aria-label="Comment">// Contact for collaboration</div>
      <div class="code-line">
        <span class="keyword">const  </span> 
        <span class="variable">githubLink</span> 
        <span class="operator">=</span> 
        <span 
          class="string" 
          [class.clickable]="gameCompleted"
          (click)="openGithub()"
          (keydown.enter)="openGithub()"
          (keydown.space)="openGithub()"
          [tabindex]="gameCompleted ? 0 : -1"
          [attr.aria-label]="gameCompleted ? 'GitHub profile link - clickable' : 'GitHub profile link - complete game to activate'"
          role="button">"https://github.com/BhaveshChhetariya"</span>
        <span class="semicolon">;</span>
      </div>
    </div>
  </div>

  <div class="hello-right">
    <div class="game-container" role="region" aria-label="Snake game">
      <div class="game-header">
        <div class="game-controls" aria-hidden="true">
          <span class="control-dot red"></span>
          <span class="control-dot yellow"></span>
          <span class="control-dot green"></span>
        </div>
      </div>
      <div class="game-content">
        <div class="game-instructions" role="region" aria-label="Game instructions">
          <p aria-label="Game instruction">// use your keyboard</p>
          <p aria-label="Game instruction">// arrows to play</p>
          <div class="arrow-keys" role="img" aria-label="Arrow key layout showing up, left, down, right keys">
            <div class="arrow-row">
              <div class="arrow-key" aria-label="Up arrow key">↑</div>
            </div>
            <div class="arrow-row">
              <div class="arrow-key" aria-label="Left arrow key">←</div>
              <div class="arrow-key" aria-label="Down arrow key">↓</div>
              <div class="arrow-key" aria-label="Right arrow key">→</div>
            </div>
          </div>
          <p class="food-left" aria-live="polite">// food left</p>
          <div class="food-dots" role="img" [attr.aria-label]="'Food remaining: ' + foodLeft + ' out of 5'">
            <span 
              *ngFor="let dot of getFoodDots(); let i = index" 
              class="dot"
              [class.eaten]="i >= foodLeft"
              [attr.aria-label]="i >= foodLeft ? 'Food eaten' : 'Food remaining'">
            </span>
          </div>
        </div>
        <div class="snake-game">
          <canvas #snakeCanvas 
                  width="300" 
                  height="200"
                  role="img"
                  [attr.aria-label]="getGameStateDescription()"
                  tabindex="0"
                  (keydown)="handleKeyPress($event)">
          </canvas>
          <div *ngIf="hasError" class="error-message" role="alert" aria-live="assertive">
            Game could not be loaded. Please refresh the page.
          </div>
        </div>
        <div class="game-buttons" role="group" aria-label="Game controls">
          <button 
            class="btn-primary" 
            (click)="startGame()"
            [disabled]="gameStarted && game.gameRunning"
            [attr.aria-label]="gameStarted && game.gameRunning ? 'Game is currently running' : 'Start the Snake game'"
            type="button">
            {{ gameStarted && game.gameRunning ? 'playing...' : 'start-game' }}
          </button>
          <button 
            class="btn-secondary" 
            (click)="skipGame()"
            aria-label="Skip the game and activate GitHub link"
            type="button">skip</button>
        </div>
      </div>
    </div>
  </div>
</div>
