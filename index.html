<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Developer </title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Full Stack Developer specializing in modern web technologies, Angular, React, Node.js, and cloud solutions. View my portfolio and projects.">
  <meta name="keywords" content="full stack developer, web developer, angular, react, node.js, javascript, typescript, portfolio">
  <meta name="author" content="Developer">
  <meta name="robots" content="index, follow">
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://developer-portfolio.com/">
  <meta property="og:title" content="Developer Portfolio - Full Stack Developer">
  <meta property="og:description" content="Full Stack Developer specializing in modern web technologies. View my portfolio and projects.">
  <meta property="og:image" content="https://developer-portfolio.com/assets/images/og-image.png">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://developer-portfolio.com/">
  <meta property="twitter:title" content="Developer Portfolio - Full Stack Developer">
  <meta property="twitter:description" content="Full Stack Developer specializing in modern web technologies. View my portfolio and projects.">
  <meta property="twitter:image" content="https://developer-portfolio.com/assets/images/og-image.png">
  
  <!-- PWA and Mobile -->
  <meta name="theme-color" content="#1e1e1e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  
  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16x16.png">
  
  <!-- External Resources -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <!-- Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Developer",
    "jobTitle": "Full Stack Developer",
    "description": "Full Stack Developer specializing in modern web technologies",
    "url": "https://developer-portfolio.com",
    "sameAs": [
      "https://linkedin.com/in/developer-profile",
      "https://github.com/developer-username"
    ],
    "knowsAbout": [
      "JavaScript",
      "TypeScript",
      "Angular",
      "React",
      "Node.js",
      "MongoDB",
      "AWS"
    ]
  }
  </script>
  
  <style>
    /* Prevent flash of unstyled content */
    body {
      margin: 0;
      padding: 0;
      background-color: #1e1e1e;
      color: #d4d4d4;
      font-family: 'Fira Code', 'Consolas', 'Monaco', monospace;
      overflow-x: hidden;
    }
    
    /* Loading spinner */
    .loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #1e1e1e;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    
    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #2d2d30;
      border-top: 3px solid #4fc3f7;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    /* Hide loading when app is ready */
    app-root:not(:empty) + .loading-container {
      display: none;
    }
  </style>
</head>
<body>
  <app-root></app-root>
  <div class="loading-container">
    <div class="loading-spinner"></div>
  </div>
</body>
</html>
