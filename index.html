  <style>
    /* Prevent flash of unstyled content */
    body {
      margin: 0;
      padding: 0;
      background-color: #1e1e1e;
      color: #d4d4d4;
      font-family: 'Fira Code', 'Consolas', 'Monaco', monospace;
      overflow-x: hidden;
    }
    
    /* Loading spinner */
    .loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #1e1e1e;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    
    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #2d2d30;
      border-top: 3px solid #4fc3f7;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    /* Hide loading when app is ready */
    app-root:not(:empty) + .loading-container {
      display: none;
    }
    
    /* Error message styling */
    .error-message {
      background-color: var(--vscode-error);
      color: white;
      padding: 8px 12px;
      border-radius: 4px;
      margin: 8px 0;
      font-size: 12px;
    }
    
    /* Fallback icons if Font Awesome fails */
    .fas::before {
      font-family: 'Font Awesome 6 Free', monospace;
      font-weight: 900;
    }
    
    /* Simple fallback symbols */
    .fa-home::before { content: '🏠'; }
    .fa-user-circle::before { content: '👤'; }
    .fa-file-alt::before { content: '📄'; }
    .fa-heart::before { content: '❤️'; }
    .fa-graduation-cap::before { content: '🎓'; }
    .fa-gamepad::before { content: '🎮'; }
    .fa-globe::before { content: '🌐'; }
    .fa-briefcase::before { content: '💼'; }
    .fa-building::before { content: '🏢'; }
    .fa-code::before { content: '💻'; }
    .fa-certificate::before { content: '📜'; }
    .fa-trophy::before { content: '🏆'; }
    .fa-folder::before { content: '📁'; }
    .fa-laptop-code::before { content: '💻'; }
    .fa-chalkboard-teacher::before { content: '👨‍🏫'; }
    .fa-newspaper::before { content: '📰'; }
    .fa-envelope::before { content: '✉️'; }
  </style>
</head>
<body>
  <app-root></app-root>
  <div class="loading-container">
    <div class="loading-spinner"></div>
  </div>
  
  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((registration) => {
            console.log('SW registered: ', registration);
          })
          .catch((registrationError) => {
            console.log('SW registration failed: ', registrationError);
          });
      });
    }
  </script>
</body>
</html>
